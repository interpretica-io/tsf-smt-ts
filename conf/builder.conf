# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_smt drives the solver over the agent's RPC
# server, so unlike the template this suite has a real agent with an RPC
# server, and the solver libraries live in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external library under test. Its reference lives in
# conf/external.yml and the commit actually built in
# conf/builder.conf.lock. The three libraries bind to the two sides:
# ta_smt and rpcs_smt onto the agent (listed again in the RPC server
# application below), tapi_smt onto the engine.
TE_EXT_REPO_USE([tsf_smt], [ta_smt rpcs_smt], [tapi_smt])

# The smt_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_smt/smt_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_smt/smt_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_smt's RPCs run here, so it links the
# agent-side ta_smt (the solver, over libz3/libcvc5) and rpcs_smt (the
# smt_* RPCs) on top of the stock RPC server. The agent host must carry
# libz3 and libcvc5 with their development headers and a C++ compiler
# (ta_smt_cvc5.cpp); see the tsf-smt README.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_smt rpcs_smt \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
